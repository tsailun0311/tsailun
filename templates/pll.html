{% extends "base.html" %}
{% block head %}
<script src="{{ url_for('static', filename='js/AnimCube3.js') }}" type="text/javascript"></script>
{% endblock %}
{% block content %}
<div class="container">
	<div class="row px-2">
		{% for i in demo %}
		<div class="col col-4 col-sm-3 col-lg-2 col-xxl-1 p-0">
			<div class="menutable">
				<a href="#c{{loop.index}}">{{i.title}}型</a>
			</div>
		</div>
		{% endfor %}
	</div>
</div>
{% for cat in demo %}
<p><span class="big" id="c{{loop.index}}">{{cat.title}}型</span></p>
<div class="container-fluid">
	<div class="row row-cols-2 row-cols-sm-3 row-cols-lg-4 row-cols-xl-6">
		{% for name, move in cat.perms %}
		<div class="col">{{name}}-perm
			<div class="cube">
				<script>AnimCube3("move={{move|safe}}")</script>
			</div>
		</div>
		{% endfor %}
	</div>
</div>
{% endfor %}
{% endblock %}
